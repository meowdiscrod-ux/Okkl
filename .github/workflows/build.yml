          if (hitC(fx - 2, y + 5, 12, 14) && click) m.favorite = !m.favorite;
          }
          if (!m.expanded) return h;
          int ry = y + 30;
          if (!theme) { drawBind(c, m, x, ry, w); ry += 17; }
          for (Setting s : m.settings) {
          if (!s.visible.getAsBoolean()) continue;
          if (s instanceof Setting.Bool b) drawBool(c, m, b, x, ry, w);
          else if (s instanceof Setting.Num n) drawNum(c, n, x, ry, w);
