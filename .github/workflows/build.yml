          int hx = tx - 18; chip(c, hx, y + 1, 16, 14, "H", m.bindMode == 0, () -> m.bindMode = 0);
          }
          private void drawBool(DrawContext c, Module m, Setting.Bool b, int x, int y, int w) {
          Fonts.draw(c, b.name, x + 8, y + 4, DIM);
