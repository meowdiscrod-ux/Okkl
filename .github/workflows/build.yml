          @Override public void onStartTick() {
          boolean use = U.bindDown(mc.options.useKey); boolean anchorHeld = mc.player.getMainHandStack().isOf(Items.RESPAWN_ANCHOR);
          if (step == 0 && use && !prevUse && anchorHeld && mc.crosshairTarget instanceof BlockHitResult b && b.getType() == HitResult.Type.BLOCK) {
          base = b.getBlockPos(); face = b.getSide(); anchor = base.offset(face); step = 1; timer = 0; timeout = 0; saved = U.cur();
          }
          if (step > 0 || (anchorHeld && use)) mc.options.useKey.setPressed(false);
          prevUse = use;
          }
          private Vec3d faceCenter(BlockPos p, Direction d) { return Vec3d.ofCenter(p).add(d.getOffsetX() * 0.5, d.getOffsetY() * 0.5, d.getOffsetZ() * 0.5); }
          private void finish() { step = 0; if (saved >= 0) { U.select(saved); saved = -1; } }
          @Override public void onTick() {
          if (step == 0) return;
          if (timer > 0) { timer--; return; }
          if (++timeout > 60) { finish(); return; }
          boolean legit = mode.idx == 0;
          switch (step) {
          case 1 -> {
          int a = U.find(s -> s.isOf(Items.RESPAWN_ANCHOR)); if (a < 0) { finish(); return; } U.select(a);
          Vec3d hv = faceCenter(base, face);
          if (!U.face(hv, legit, 60)) return;
          mc.interactionManager.interactBlock(mc.player, Hand.MAIN_HAND, new BlockHitResult(hv, face, base, false));
          mc.player.swingHand(Hand.MAIN_HAND); if (!legit) U.restoreRot();
          step = 2; timer = speed.i() + cooldown.i(); timeout = 0;
          }
          case 2 -> {
          if (!mc.world.getBlockState(anchor).isOf(Blocks.RESPAWN_ANCHOR)) return;
          int g = U.find(s -> s.isOf(Items.GLOWSTONE)); if (g < 0) { finish(); return; } U.select(g);
          Vec3d hv = faceCenter(anchor, Direction.UP);
          if (!U.face(hv, legit, 60)) return;
          mc.interactionManager.interactBlock(mc.player, Hand.MAIN_HAND, new BlockHitResult(hv, Direction.UP, anchor, false));
          mc.player.swingHand(Hand.MAIN_HAND); if (!legit) U.restoreRot();
          step = 3; timer = speed.i() + cooldown.i(); timeout = 0;
          }
          case 3 -> {
          int g = U.find(s -> s.isOf(Items.GLOWSTONE)); if (g < 0) { finish(); return; } U.select(g);
          Vec3d pc = Vec3d.ofCenter(anchor);
          double dx = mc.player.getX() - pc.x, dz = mc.player.getZ() - pc.z;
          Direction dir = Math.abs(dx) > Math.abs(dz) ? (dx > 0 ? Direction.EAST : Direction.WEST) : (dz > 0 ? Direction.SOUTH : Direction.NORTH);
          BlockPos shield = anchor.offset(dir);
          if (!mc.world.getBlockState(shield).isAir()) { finish(); return; }
          for (Direction d : Direction.values()) {
          BlockPos nb = shield.offset(d);
          if (nb.equals(anchor) || mc.world.getBlockState(nb).isAir()) continue;
          Vec3d hv = faceCenter(nb, d.getOpposite());
          if (!U.face(hv, legit, 60)) return;
          mc.interactionManager.interactBlock(mc.player, Hand.MAIN_HAND, new BlockHitResult(hv, d.getOpposite(), nb, false));
          mc.player.swingHand(Hand.MAIN_HAND); if (!legit) U.restoreRot();
          break;
          }
          finish();
          }
          default -> finish();
          }
          }
          }
          EOF_MEOW
          mkdir -p "proj/src/main/java/dev/meow/client/modules"
          cat > "proj/src/main/java/dev/meow/client/modules/TriggerBot.java" <<'EOF_MEOW'
          package dev.meow.client.modules;
          import dev.meow.client.core.*;
          import dev.meow.client.util.U;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.util.hit.EntityHitResult;
          public class TriggerBot extends Module {
          final Setting.Bool weaponsOnly = add(new Setting.Bool("Weapons Only", true));
          public TriggerBot() { super("Trigger Bot", "Attacks when your crosshair is on a target", Category.COMBAT); }
          @Override public void onTick() {
          if (!(mc.crosshairTarget instanceof EntityHitResult r) || !(r.getEntity() instanceof LivingEntity t) || !t.isAlive()) return;
          if (weaponsOnly.v && !U.isWeapon(mc.player.getMainHandStack())) return;
          if (U.cd() < 0.92f) return;
          U.attack(t, false);
          }
          }
          EOF_MEOW
          mkdir -p "proj/src/main/java/dev/meow/client/util"
          cat > "proj/src/main/java/dev/meow/client/util/U.java" <<'EOF_MEOW'
          package dev.meow.client.util;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.network.ClientPlayerEntity;
          import net.minecraft.client.util.InputUtil;
          import net.minecraft.enchantment.Enchantments;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.entity.mob.HostileEntity;
          import net.minecraft.entity.player.PlayerEntity;
          import net.minecraft.item.ItemStack;
          import net.minecraft.item.Items;
          import net.minecraft.network.packet.c2s.play.PlayerMoveC2SPacket;
          import net.minecraft.registry.Registries;
          import net.minecraft.registry.tag.ItemTags;
          import net.minecraft.util.Hand;
          import net.minecraft.util.math.Box;
          import net.minecraft.util.math.MathHelper;
          import net.minecraft.util.math.Vec3d;
          import org.lwjgl.glfw.GLFW;
          import java.util.function.Predicate;
          public final class U {
          public static final MinecraftClient mc = MinecraftClient.getInstance();
          private U() {}
          public static long win() { return mc.getWindow().getHandle(); }
          public static boolean keyDown(int k) { return k >= 0 && GLFW.glfwGetKey(win(), k) == GLFW.GLFW_PRESS; }
          public static boolean mouseDown(int b) { return GLFW.glfwGetMouseButton(win(), b) == GLFW.GLFW_PRESS; }
          public static boolean bindDown(KeyBinding kb) {
          InputUtil.Key k = InputUtil.fromTranslationKey(kb.getBoundKeyTranslationKey());
          return k.getCategory() == InputUtil.Type.MOUSE ? mouseDown(k.getCode()) : keyDown(k.getCode());
          }
          public static int cur() { return mc.player.getInventory().getSelectedSlot(); }
          public static void select(int s) { mc.player.getInventory().setSelectedSlot(s); }
          public static int find(Predicate<ItemStack> f) { for (int i = 0; i < 9; i++) if (f.test(mc.player.getInventory().getStack(i))) return i; return -1; }
          public static boolean isMace(ItemStack s) { return s.isOf(Items.MACE); }
          public static boolean isSword(ItemStack s) { return s.isIn(ItemTags.SWORDS); }
          public static boolean isAxe(ItemStack s) { return s.isIn(ItemTags.AXES); }
          public static boolean isSpear(ItemStack s) { return Registries.ITEM.getId(s.getItem()).getPath().endsWith("_spear"); }
          public static boolean isWeapon(ItemStack s) { return isSword(s) || isAxe(s) || isMace(s) || isSpear(s); }
          public static boolean hasBreach(ItemStack s) {
          return s.isOf(Items.MACE) && s.getEnchantments().getEnchantments().stream().anyMatch(e -> e.matchesKey(Enchantments.BREACH));
          }
          public static Vec3d closest(Box b, Vec3d p) { return new Vec3d(MathHelper.clamp(p.x, b.minX, b.maxX), MathHelper.clamp(p.y, b.minY, b.maxY), MathHelper.clamp(p.z, b.minZ, b.maxZ)); }
          public static double dist(Entity e) { Vec3d eye = mc.player.getEyePos(); return eye.distanceTo(closest(e.getBoundingBox(), eye)); }
          public static Vec3d aimPoint(Entity e, double pct) { return new Vec3d(e.getX(), e.getY() + e.getHeight() * pct / 100.0, e.getZ()); }
          public static LivingEntity target(double range) {
          LivingEntity best = null; double bd = Double.MAX_VALUE;
          for (Entity e : mc.world.getEntities()) {
          if (!(e instanceof LivingEntity le) || e == mc.player || !le.isAlive() || le.isSpectator()) continue;
          if (!(le instanceof PlayerEntity || le instanceof HostileEntity)) continue;
          double d = dist(le);
          if (d <= range && d < bd) { bd = d; best = le; }
          }
          return best;
          }
          public static float[] rot(Vec3d to) {
          Vec3d eye = mc.player.getEyePos();
          double dx = to.x - eye.x, dy = to.y - eye.y, dz = to.z - eye.z;
          float yaw = (float) (Math.toDegrees(Math.atan2(dz, dx)) - 90.0);
          float pitch = (float) -Math.toDegrees(Math.atan2(dy, Math.sqrt(dx * dx + dz * dz)));
          return new float[]{yaw, MathHelper.clamp(pitch, -90f, 90f)};
          }
          public static boolean aim(Vec3d to, double speed) {
          ClientPlayerEntity p = mc.player; float[] r = rot(to);
          float dy = MathHelper.wrapDegrees(r[0] - p.getYaw()), dp = r[1] - p.getPitch();
          float sp = (float) speed;
          float sy = MathHelper.clamp(dy, -sp, sp), spp = MathHelper.clamp(dp, -sp, sp);
          double f = mc.options.getMouseSensitivity().getValue() * 0.6 + 0.2; double gcd = f * f * f * 8.0 * 0.15;
          if (Math.abs(dy) > gcd) sy = (float) (Math.round(sy / gcd) * gcd);
          if (Math.abs(dp) > gcd) spp = (float) (Math.round(spp / gcd) * gcd);
          p.setYaw(p.getYaw() + sy); p.setPitch(MathHelper.clamp(p.getPitch() + spp, -90f, 90f));
          return Math.abs(MathHelper.wrapDegrees(r[0] - p.getYaw())) < 2.5f && Math.abs(r[1] - p.getPitch()) < 2.5f;
          }
          public static boolean rayHits(Entity t, double range) {
          ClientPlayerEntity p = mc.player; Vec3d eye = p.getEyePos(); Vec3d end = eye.add(p.getRotationVec(1f).multiply(range));
          Box b = t.getBoundingBox().expand(t.getTargetingMargin());
          return b.contains(eye) || b.raycast(eye, end).isPresent();
          }
          public static void sendRot(float yaw, float pitch) {
          mc.player.networkHandler.sendPacket(new PlayerMoveC2SPacket.LookAndOnGround(yaw, pitch, mc.player.isOnGround(), mc.player.horizontalCollision));
          }
          public static boolean face(Vec3d to, boolean legit, double speed) {
          if (legit) return aim(to, speed);
          float[] r = rot(to); sendRot(r[0], r[1]); return true;
          }
          public static void restoreRot() { sendRot(mc.player.getYaw(), mc.player.getPitch()); }
          public static void attack(Entity t, boolean silent) {
          ClientPlayerEntity p = mc.player;
          if (silent) { float[] r = rot(aimPoint(t, 65)); sendRot(r[0], r[1]); }
          mc.interactionManager.attackEntity(p, t); p.swingHand(Hand.MAIN_HAND);
          if (silent) restoreRot();
          }
          public static float cd() { return mc.player.getAttackCooldownProgress(0.5f); }
          public static boolean falling(double minFall) {
          ClientPlayerEntity p = mc.player;
          return !p.isOnGround() && !p.isClimbing() && !p.isTouchingWater() && p.getVelocity().y < 0 && (double) p.fallDistance >= minFall;
          }
          }
          EOF_MEOW
