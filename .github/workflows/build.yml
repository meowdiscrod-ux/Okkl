name: Build Meow Client
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.2.0"
      - name: Write files 1
        run: |
          mkdir -p "proj/"
          cat > "proj/build.gradle" <<'EOF_MEOW'
          plugins { id 'fabric-loom' version '1.14-SNAPSHOT' }
          version = project.mod_version
          group = project.maven_group
          base { archivesName = project.archives_base_name }
          dependencies {
            minecraft "com.mojang:minecraft:${project.minecraft_version}"
            mappings "net.fabricmc:yarn:${project.yarn_mappings}:v2"
            modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"
            modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"
          }
          processResources {
            inputs.property "version", project.version
            filesMatching("fabric.mod.json") { expand "version": inputs.properties.version }
          }
          tasks.withType(JavaCompile).configureEach { it.options.release = 21 }
          java { sourceCompatibility = JavaVersion.VERSION_21; targetCompatibility = JavaVersion.VERSION_21 }
          EOF_MEOW
          mkdir -p "proj/"
          cat > "proj/gradle.properties" <<'EOF_MEOW'
          org.gradle.jvmargs=-Xmx2G
          minecraft_version=1.21.11
          yarn_mappings=1.21.11+build.1
          loader_version=0.18.1
          fabric_version=0.139.4+1.21.11
          mod_version=1.0.0
          maven_group=dev.meow
          archives_base_name=meowclient
          EOF_MEOW
          mkdir -p "proj/"
          cat > "proj/settings.gradle" <<'EOF_MEOW'
          pluginManagement { repositories { maven { url = 'https://maven.fabricmc.net/' }; mavenCentral(); gradlePluginPortal() } }
          EOF_MEOW
          mkdir -p "proj/src/main/java/dev/meow/client"
          cat > "proj/src/main/java/dev/meow/client/MeowClient.java" <<'EOF_MEOW'
          package dev.meow.client;
          import dev.meow.client.core.*;
          import dev.meow.client.gui.MeowScreen;
          import dev.meow.client.util.U;
          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.minecraft.client.gui.screen.TitleScreen;
          import org.lwjgl.glfw.GLFW;
          public class MeowClient implements ClientModInitializer {
          public static ModuleManager mm;
          private boolean prevShift;
          @Override public void onInitializeClient() {
          mm = new ModuleManager();
          Config.load();
          ClientTickEvents.START_CLIENT_TICK.register(c -> mm.startTick());
          ClientTickEvents.END_CLIENT_TICK.register(c -> {
          mm.endTick();
          boolean d = U.keyDown(GLFW.GLFW_KEY_RIGHT_SHIFT);
          if (d && !prevShift && (c.currentScreen == null || c.currentScreen instanceof TitleScreen)) c.setScreen(new MeowScreen());
          prevShift = d;
          });
          }
          }
          EOF_MEOW
          mkdir -p "proj/src/main/java/dev/meow/client/core"
          cat > "proj/src/main/java/dev/meow/client/core/Category.java" <<'EOF_MEOW'
          package dev.meow.client.core;
          public enum Category { COMBAT, MACE, MISC, MOVEMENT, SPEAR, VISUAL }
          EOF_MEOW
          mkdir -p "proj/src/main/java/dev/meow/client/core"
          cat > "proj/src/main/java/dev/meow/client/core/Config.java" <<'EOF_MEOW'
          package dev.meow.client.core;
          import dev.meow.client.MeowClient;
          import net.fabricmc.loader.api.FabricLoader;
          import java.nio.file.*;
          import java.util.*;
          public class Config {
          static Path path() { return FabricLoader.getInstance().getConfigDir().resolve("meowclient").resolve("default.yml"); }
          private static void write(StringBuilder sb, Module m) {
          sb.append("  ").append(m.name).append(":\n");
          sb.append("    enabled: ").append(m.enabled).append('\n');
          sb.append("    key: ").append(m.key).append('\n');
          sb.append("    bindMode: ").append(m.bindMode).append('\n');
          sb.append("    favorite: ").append(m.favorite).append('\n');
          sb.append("    expanded: ").append(m.expanded).append('\n');
          sb.append("    settings:\n");
          for (Setting s : m.settings) sb.append("      ").append(s.name).append(": ").append(s.get()).append('\n');
          }
          public static void save() {
          try {
          StringBuilder sb = new StringBuilder("# Meow Client config\nmodules:\n");
          write(sb, MeowClient.mm.theme);
          for (Module m : MeowClient.mm.all) write(sb, m);
          Files.createDirectories(path().getParent());
          Files.writeString(path(), sb.toString());
          } catch (Exception e) { e.printStackTrace(); }
          }
          private static Object val(String v) {
          if (v.equals("true")) return true; if (v.equals("false")) return false;
          try { return Double.parseDouble(v); } catch (Exception e) { return v; }
          }
          public static void load() {
          try {
          if (!Files.exists(path())) return;
          Map<String, Module> by = new HashMap<>(); by.put(MeowClient.mm.theme.name, MeowClient.mm.theme);
          for (Module m : MeowClient.mm.all) by.put(m.name, m);
          Module cur = null; boolean inSet = false;
          for (String line : Files.readAllLines(path())) {
          String t = line.strip(); if (t.isEmpty() || t.startsWith("#")) continue;
          int ind = line.length() - line.stripLeading().length();
          if (ind == 2 && t.endsWith(":")) { cur = by.get(t.substring(0, t.length() - 1)); inSet = false; continue; }
          if (cur == null) continue;
          if (ind == 4 && t.equals("settings:")) { inSet = true; continue; }
          int i = t.indexOf(": "); if (i < 0) continue;
          String k = t.substring(0, i), v = t.substring(i + 2).strip();
          if (ind == 4) {
          inSet = false;
          switch (k) {
          case "enabled" -> cur.enabled = v.equals("true");
          case "key" -> cur.key = (int) Double.parseDouble(v);
          case "bindMode" -> cur.bindMode = (int) Double.parseDouble(v);
          case "favorite" -> cur.favorite = v.equals("true");
          case "expanded" -> cur.expanded = v.equals("true");
          default -> {}
          }
          } else if (ind == 6 && inSet) {
          for (Setting s : cur.settings) if (s.name.equals(k)) s.set(val(v));
          }
          }
          } catch (Exception e) { e.printStackTrace(); }
          }
          }
          EOF_MEOW
      - name: Write files 2
        run: |
          mkdir -p "proj/src/main/java/dev/meow/client/core"
          cat > "proj/src/main/java/dev/meow/client/core/Module.java" <<'EOF_MEOW'
          package dev.meow.client.core;
          import net.minecraft.client.MinecraftClient;
          import java.util.ArrayList;
          import java.util.List;
          public abstract class Module {
          public final String name, desc; public final Category cat;
          public boolean enabled, expanded = true, favorite, keyPrev;
          public int key = -1;
          public int bindMode = 1;
          public final List<Setting> settings = new ArrayList<>();
          protected final MinecraftClient mc = MinecraftClient.getInstance();
          protected Module(String n, String d, Category c) { name = n; desc = d; cat = c; }
          protected <T extends Setting> T add(T s) { settings.add(s); return s; }
          public void toggle() { setEnabled(!enabled); }
          public void setEnabled(boolean b) { if (b == enabled) return; enabled = b; if (b) onEnable(); else onDisable(); }
          public void onEnable() {}
          public void onDisable() {}
          public void onStartTick() {}
          public void onTick() {}
          }
          EOF_MEOW
          mkdir -p "proj/src/main/java/dev/meow/client/core"
          cat > "proj/src/main/java/dev/meow/client/core/ModuleManager.java" <<'EOF_MEOW'
          package dev.meow.client.core;
          import dev.meow.client.modules.*;
          import dev.meow.client.util.U;
          import net.minecraft.client.MinecraftClient;
          import java.util.ArrayList;
          import java.util.List;
          public class ModuleManager {
          public final List<Module> all = new ArrayList<>();
          public final ThemeModule theme = new ThemeModule();
          private final MinecraftClient mc = MinecraftClient.getInstance();
          public ModuleManager() {
          all.add(new AimAssist()); all.add(new TriggerBot()); all.add(new AutoCrystal()); all.add(new SafeAnchors());
          all.add(new AutoMace()); all.add(new BreachSwap()); all.add(new MaceSwap());
          all.add(new AutoPearlCatch());
          }
          private boolean ready() { return mc.player != null && mc.world != null && mc.interactionManager != null; }
          public void startTick() {
          if (!ready() || mc.currentScreen != null) return;
          for (Module m : all) {
          if (m.key < 0 || m.bindMode == 2) continue;
          boolean d = U.keyDown(m.key);
          if (m.bindMode == 1) { if (d && !m.keyPrev) m.toggle(); } else m.setEnabled(d);
          m.keyPrev = d;
          }
          for (Module m : all) if (m.enabled) m.onStartTick();
          }
          public void endTick() {
          if (!ready() || mc.currentScreen != null) return;
          for (Module m : all) if (m.enabled) m.onTick();
          }
          public long active() { return all.stream().filter(m -> m.enabled).count(); }
          }
          EOF_MEOW
          mkdir -p "proj/src/main/java/dev/meow/client/core"
          cat > "proj/src/main/java/dev/meow/client/core/Setting.java" <<'EOF_MEOW'
          package dev.meow.client.core;
          import java.util.function.BooleanSupplier;
          public abstract class Setting {
          public final String name;
          public BooleanSupplier visible = () -> true;
          protected Setting(String n) { name = n; }
          public Setting showIf(BooleanSupplier s) { visible = s; return this; }
          public abstract Object get();
          public abstract void set(Object o);
          public static class Bool extends Setting {
          public boolean v;
          public Bool(String n, boolean d) { super(n); v = d; }
          public Object get() { return v; }
          public void set(Object o) { if (o instanceof Boolean b) v = b; }
          }
          public static class Num extends Setting {
          public double v, min, max, step;
          public Num(String n, double min, double max, double step, double d) { super(n); this.min = min; this.max = max; this.step = step; v = d; }
          public int i() { return (int) Math.round(v); }
          public Object get() { return v; }
          public void set(Object o) { if (o instanceof Number n) v = Math.max(min, Math.min(max, n.doubleValue())); }
          }
          public static class Mode extends Setting {
          public String[] modes; public int idx;
          public Mode(String n, String[] m, int d) { super(n); modes = m; idx = d; }
          public String cur() { return modes[idx]; }
          public Object get() { return modes[idx]; }
          public void set(Object o) { if (o instanceof String s) for (int i = 0; i < modes.length; i++) if (modes[i].equals(s)) idx = i; }
          }
          }
          EOF_MEOW
          mkdir -p "proj/src/main/java/dev/meow/client/core"
          cat > "proj/src/main/java/dev/meow/client/core/ThemeModule.java" <<'EOF_MEOW'
          package dev.meow.client.core;
          public class ThemeModule extends Module {
          public static final Setting.Num R = new Setting.Num("Accent Red", 0, 255, 1, 232);
          public static final Setting.Num G = new Setting.Num("Accent Green", 0, 255, 1, 160);
          public static final Setting.Num B = new Setting.Num("Accent Blue", 0, 255, 1, 32);
          public static final Setting.Bool ORBS = new Setting.Bool("Cursor Orbs", true);
          public static final Setting.Num ORB_COUNT = new Setting.Num("Orb Count", 1, 8, 1, 3);
          public static final Setting.Num ORB_SIZE = new Setting.Num("Orb Size", 3, 12, 1, 5);
          public ThemeModule() {
          super("Appearance", "GUI colors and cursor effects", Category.VISUAL);
          settings.add(R); settings.add(G); settings.add(B); settings.add(ORBS); settings.add(ORB_COUNT); settings.add(ORB_SIZE);
          }
          public static int accent() { return 0xFF000000 | (R.i() << 16) | (G.i() << 8) | B.i(); }
          }
          EOF_MEOW
          mkdir -p "proj/src/main/java/dev/meow/client/gui"
          cat > "proj/src/main/java/dev/meow/client/gui/Fonts.java" <<'EOF_MEOW'
          package dev.meow.client.gui;
          import net.minecraft.client.MinecraftClient;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.text.*;
          import net.minecraft.util.Identifier;
          public final class Fonts {
          private static Style style; private static boolean init;
          private static void ensure() {
          if (init) return; init = true;
          Identifier ttf = Identifier.of("meowclient", "font/inter.ttf");
          if (MinecraftClient.getInstance().getResourceManager().getResource(ttf).isPresent()) {
          style = Style.EMPTY.withFont(new StyleSpriteSource.Font(Identifier.of("meowclient", "ui")));
          }
          }
          private static Text t(String s) { ensure(); return style == null ? Text.literal(s) : Text.literal(s).setStyle(style); }
          public static int w(String s) { return MinecraftClient.getInstance().textRenderer.getWidth(t(s)); }
          public static void draw(DrawContext c, String s, int x, int y, int color) { c.drawText(MinecraftClient.getInstance().textRenderer, t(s), x, y, color, false); }
          public static void center(DrawContext c, String s, int cx, int y, int color) { draw(c, s, cx - w(s) / 2, y, color); }
          public static String fit(String s, int max) { if (w(s) <= max) return s; while (s.length() > 1 && w(s + "..") > max) s = s.substring(0, s.length() - 1); return s + ".."; }
          }
          EOF_MEOW
          mkdir -p "proj/src/main/java/dev/meow/client/gui"
          cat > "proj/src/main/java/dev/meow/client/gui/MeowScreen.java" <<'EOF_MEOW'
          package dev.meow.client.gui;
          import dev.meow.client.MeowClient;
          import dev.meow.client.core.*;
          import dev.meow.client.util.U;
          import net.minecraft.client.gui.DrawContext;
          import net.minecraft.client.gui.screen.Screen;
          import net.minecraft.text.Text;
          import org.lwjgl.glfw.GLFW;
          import java.util.*;
          public class MeowScreen extends Screen {
          enum Page {
          ALL("All", null), FAV("Favorites", null), COMBAT("Combat", Category.COMBAT), MACE("Mace", Category.MACE), MISC("Misc", Category.MISC),
          MOVEMENT("Movement", Category.MOVEMENT), SPEAR("Spear", Category.SPEAR), VISUAL("Visual", Category.VISUAL),
          PRESETS("Presets", null), KEYBINDS("Keybinds", null), APPEARANCE("Appearance", null), SETTINGS("Settings", null);
          final String label; final Category cat;
          Page(String l, Category c) { label = l; cat = c; }
          boolean top() { return ordinal() <= VISUAL.ordinal(); }
          }
          static final int PANEL = 0xF2323547, SIDE = 0xFF2A2D3B, CARD = 0xFF3B3E52, ROW = 0xFF2F3243, TEXT = 0xFFEDEEF3, DIM = 0xFF9A9DB2, OFF = 0xFF565A70;
          private static Page lastPage = Page.COMBAT; private static float lastScroll;
          private final Screen parent;
          private boolean prevDown, prevR, prevShift, down, click, rclick;
          private final boolean[] kp = new boolean[400];
          private String search = ""; private boolean searchFocus, activeOnly, namesOnly;
          private Module listening; private Setting.Num dragging; private int dragX, dragW;
          private float scroll = lastScroll, maxScroll;
          private final Map<String, Float> anim = new HashMap<>();
          private int mx, my, cx, cy, cw, ch;
          private final long t0 = System.currentTimeMillis();
          public MeowScreen() {
          super(Text.literal("Meow Client"));
          parent = net.minecraft.client.MinecraftClient.getInstance().currentScreen;
          prevShift = U.keyDown(GLFW.GLFW_KEY_RIGHT_SHIFT);
          }
          @Override public boolean shouldPause() { return false; }
          @Override public void close() { Config.save(); lastScroll = scroll; client.setScreen(parent); }
          @Override public boolean mouseScrolled(double x, double y, double h, double v) { scroll = Math.max(0, Math.min(maxScroll, scroll - (float) v * 18f)); return true; }
          private float an(String k, boolean on) { float v = anim.getOrDefault(k, on ? 1f : 0f); v += ((on ? 1f : 0f) - v) * 0.28f; anim.put(k, v); return v; }
          private boolean hit(int x, int y, int w, int h) { return mx >= x && mx < x + w && my >= y && my < y + h; }
          private boolean hitC(int x, int y, int w, int h) { return hit(x, y, w, h) && my >= cy && my < cy + ch; }
          private int accent() { return ThemeModule.accent(); }
          private static String keyName(int k) {
          if (k < 0) return "None";
          String n = GLFW.glfwGetKeyName(k, 0); if (n != null) return n.toUpperCase();
          return switch (k) { case GLFW.GLFW_KEY_RIGHT_SHIFT -> "RShift"; case GLFW.GLFW_KEY_LEFT_SHIFT -> "LShift"; case GLFW.GLFW_KEY_SPACE -> "Space";
          case GLFW.GLFW_KEY_LEFT_CONTROL -> "LCtrl"; case GLFW.GLFW_KEY_LEFT_ALT -> "LAlt"; default -> "K" + k; };
          }
          private void pollKeys() {
          for (int k = 32; k < 349; k++) {
          boolean d = U.keyDown(k); boolean press = d && !kp[k]; kp[k] = d; if (!press) continue;
          if (listening != null) { listening.key = k == GLFW.GLFW_KEY_ESCAPE ? -1 : k; if (listening.key >= 0 && listening.bindMode == 2) listening.bindMode = 1; listening = null; continue; }
          if (searchFocus) {
          if (k == GLFW.GLFW_KEY_BACKSPACE && !search.isEmpty()) search = search.substring(0, search.length() - 1);
          else if (k == GLFW.GLFW_KEY_ESCAPE || k == GLFW.GLFW_KEY_ENTER) searchFocus = false;
          else if (search.length() < 20 && ((k >= 'A' && k <= 'Z') || (k >= '0' && k <= '9'))) search += Character.toLowerCase((char) k);
          else if (k == GLFW.GLFW_KEY_SPACE) search += " ";
          }
          }
          }
          @Override public void render(DrawContext c, int mouseX, int mouseY, float delta) {
          mx = mouseX; my = mouseY;
          down = U.mouseDown(0); click = down && !prevDown; prevDown = down;
          boolean r = U.mouseDown(1); rclick = r && !prevR; prevR = r;
          boolean sh = U.keyDown(GLFW.GLFW_KEY_RIGHT_SHIFT);
          if (sh && !prevShift) { close(); return; } prevShift = sh;
          if (!down) dragging = null;
          pollKeys();
          if (client.world == null) super.renderBackground(c, mouseX, mouseY, delta);
          c.fill(0, 0, width, height, 0x55000000);
          int pw = Math.min(width - 12, 660), ph = Math.min(height - 12, 370);
          int px = (width - pw) / 2, py = (height - ph) / 2;
          int SB = Math.min(96, pw / 4);
          R.rrect(c, px - 1, py - 1, pw + 2, ph + 2, 9, 0x55000000);
          R.rrect(c, px, py, pw, ph, 8, PANEL);
          R.rrect(c, px + 5, py + 5, SB, ph - 10, 6, SIDE);
          R.rrect(c, px + 11, py + 11, 14, 14, 3, 0xFFF1F1F4); Fonts.center(c, "M", px + 18, py + 14, 0xFF23252F);
          Fonts.draw(c, "MEOW", px + 31, py + 14, TEXT);
          int iy = py + 34;
          for (Page p : Page.values()) if (p.top()) { sideItem(c, p, px + 10, iy, SB - 10); iy += 16; }
          int by = py + ph - 10 - 4 * 16 - 2;
          c.fill(px + 11, by - 5, px + 5 + SB - 6, by - 4, 0x33FFFFFF);
          for (Page p : Page.values()) if (!p.top()) { sideItem(c, p, px + 10, by, SB - 10); by += 16; }
          int hx = px + SB + 11, hy = py + 5, hw = pw - SB - 16, hh = 26;
          R.rrect(c, hx, hy, hw, hh, 6, SIDE);
          Fonts.draw(c, lastPage.label, hx + 8, hy + 5, TEXT);
          Fonts.draw(c, MeowClient.mm.active() + " active", hx + 8, hy + 15, DIM);
          int rx = hx + hw - 6;
          int bw = Fonts.w("Names Only") + 10; rx -= bw; chip(c, rx, hy + 6, bw, 14, "Names Only", namesOnly, () -> namesOnly = !namesOnly);
          bw = Fonts.w("Active Only") + 10; rx -= bw + 4; chip(c, rx, hy + 6, bw, 14, "Active Only", activeOnly, () -> activeOnly = !activeOnly);
          int sw = Math.max(60, Math.min(120, rx - (hx + 80) - 6)); rx -= sw + 4;
          if (sw > 50) {
          R.outline(c, rx, hy + 6, sw, 14, 4, searchFocus ? accent() : 0xFF4A4E65, 0xFF262938);
          Fonts.draw(c, search.isEmpty() && !searchFocus ? "Search..." : Fonts.fit(search + (searchFocus && (System.currentTimeMillis() / 500) % 2 == 0 ? "|" : ""), sw - 10), rx + 5, hy + 9, search.isEmpty() ? DIM : TEXT);
          if (click) searchFocus = hit(rx, hy + 6, sw, 14);
          }
          cx = hx; cy = hy + hh + 6; cw = hw; ch = py + ph - 5 - cy;
          c.enableScissor(cx, cy, cx + cw, cy + ch);
          int total = drawContent(c);
          c.disableScissor();
          maxScroll = Math.max(0, total - ch);
          scroll = Math.max(0, Math.min(maxScroll, scroll));
          if (maxScroll > 0) { int th = Math.max(16, (int) (ch * (ch / (float) total))); int ty = cy + (int) ((ch - th) * (scroll / maxScroll)); R.rrect(c, cx + cw - 3, ty, 2, th, 1, 0x88FFFFFF); }
          if (ThemeModule.ORBS.v) {
          float tt = (System.currentTimeMillis() - t0) / 1000f; int ac = accent(); int n = ThemeModule.ORB_COUNT.i(); int rad = ThemeModule.ORB_SIZE.i();
          R.glow(c, mx, my, rad * 5, ac, 0.45f);
          for (int i = 0; i < n; i++) {
          double a = tt * 2.0 + i * Math.PI * 2 / n;
          R.glow(c, (int) (mx + Math.cos(a) * rad * 3.4), (int) (my + Math.sin(a) * rad * 3.4), rad, ac, 1.0f);
          double b = a - 0.35; R.glow(c, (int) (mx + Math.cos(b) * rad * 3.4), (int) (my + Math.sin(b) * rad * 3.4), rad * 0.6, ac, 0.6f);
          }
          }
          }
          private void sideItem(DrawContext c, Page p, int x, int y, int w) {
          boolean sel = lastPage == p; boolean hov = hit(x, y, w, 14);
          float a = an("side" + p, sel);
          if (a > 0.02f) R.outline(c, x, y, w, 14, 4, R.alpha(accent(), (int) (255 * a)), R.mix(0xFF2A2D3B, 0xFF3B3427, a));
          else if (hov) R.rrect(c, x, y, w, 14, 4, 0xFF343748);
          Fonts.draw(c, p.label, x + 8, y + 3, sel ? TEXT : DIM);
          if (click && hov) { lastPage = p; scroll = 0; }
          }
          private void chip(DrawContext c, int x, int y, int w, int h, String t, boolean on, Runnable act) {
          boolean hov = hit(x, y, w, h);
          R.outline(c, x, y, w, h, 4, on ? accent() : 0xFF4A4E65, on ? R.mix(0xFF262938, accent(), 0.25f) : (hov ? 0xFF303346 : 0xFF262938));
          Fonts.center(c, t, x + w / 2, y + 3, on ? TEXT : DIM);
          if (click && hov) act.run();
          }
          private List<Module> visible() {
          List<Module> out = new ArrayList<>();
          for (Module m : MeowClient.mm.all) {
          Page p = lastPage;
          if (p.cat != null && m.cat != p.cat) continue;
          if (p == Page.FAV && !m.favorite) continue;
          if (activeOnly && !m.enabled) continue;
          String q = search.trim().toLowerCase();
          if (!q.isEmpty() && !(m.name.toLowerCase().contains(q) || (!namesOnly && m.desc.toLowerCase().contains(q)))) continue;
          out.add(m);
          }
          return out;
          }
          private int drawContent(DrawContext c) {
          int top = cy - (int) scroll;
          if (lastPage == Page.APPEARANCE) { return drawCards(c, List.of(MeowClient.mm.theme), top, true); }
          if (lastPage == Page.KEYBINDS) {
          int y = top;
          for (Module m : MeowClient.mm.all) {
