          Fonts.center(c, md.cur(), bx + bw / 2 - 3, y + 4, TEXT); Fonts.draw(c, "v", bx + bw - 9, y + 4, DIM);
          if (hitC(bx, y + 1, bw, 14)) { if (click) md.idx = (md.idx + 1) % md.modes.length; if (rclick) md.idx = (md.idx + md.modes.length - 1) % md.modes.length; }
          }
          private void drawNum(DrawContext c, Setting.Num n, int x, int y, int w) {
          Fonts.draw(c, n.name, x + 8, y + 3, DIM);
          String v = n.step >= 1 ? String.valueOf(n.i()) : n.step >= 0.1 ? String.format(Locale.ROOT, "%.1f", n.v) : String.format(Locale.ROOT, "%.2f", n.v);
          int vw = Fonts.w(v) + 8; R.rrect(c, x + w - 8 - vw, y + 1, vw, 12, 3, ROW); Fonts.center(c, v, x + w - 8 - vw / 2, y + 3, TEXT);
