          package dev.meow.client.gui;
          import net.minecraft.client.gui.DrawContext;
          public final class R {
          public static void rrect(DrawContext c, int x, int y, int w, int h, int r, int col) {
          r = Math.max(0, Math.min(r, Math.min(w, h) / 2));
          c.fill(x, y + r, x + w, y + h - r, col);
          for (int i = 0; i < r; i++) {
          double dy = r - i - 0.5; int in = (int) Math.round(r - Math.sqrt(r * r - dy * dy));
          c.fill(x + in, y + i, x + w - in, y + i + 1, col);
          c.fill(x + in, y + h - 1 - i, x + w - in, y + h - i, col);
          }
          }
          public static void outline(DrawContext c, int x, int y, int w, int h, int r, int border, int fill) {
          rrect(c, x, y, w, h, r, border); rrect(c, x + 1, y + 1, w - 2, h - 2, Math.max(0, r - 1), fill);
          }
          public static void circle(DrawContext c, int cx, int cy, double r, int col) {
          int ri = (int) Math.ceil(r);
          for (int dy = -ri; dy <= ri; dy++) {
          double q = r * r - dy * dy; if (q < 0) continue; int dx = (int) Math.round(Math.sqrt(q));
          c.fill(cx - dx, cy + dy, cx + dx, cy + dy + 1, col);
          }
          }
          public static void glow(DrawContext c, int cx, int cy, double r, int rgb, float strength) {
          for (int k = 0; k < 6; k++) {
          double rr = r * (1.0 - k * 0.16); int a = (int) (255 * strength * 0.16);
          circle(c, cx, cy, rr, (Math.min(255, a) << 24) | (rgb & 0xFFFFFF));
          }
          }
          public static int mix(int a, int b, float t) {
          int r = 0; for (int s = 24; s >= 0; s -= 8) { int x = (a >> s) & 255, y = (b >> s) & 255; r |= ((int) (x + (y - x) * t) & 255) << s; } return r;
          }
          public static int alpha(int col, int a) { return (a << 24) | (col & 0xFFFFFF); }
          }
          EOF_MEOW
